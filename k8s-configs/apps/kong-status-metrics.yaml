apiVersion: v1
kind: Service
metadata:
  name: kong-kong-status
  namespace: kong
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: status
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/instance: kong
    app.kubernetes.io/name: kong
  ports:
    - name: status
      port: 8100
      targetPort: 8100
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kong-status
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - kong
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
      app.kubernetes.io/component: status
  endpoints:
    - port: status
      path: /metrics
      interval: 30s
