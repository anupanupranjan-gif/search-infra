apiVersion: v1
kind: Service
metadata:
  name: kong-admin-bridge
  namespace: default
spec:
  type: ExternalName
  externalName: kong-kong-admin.kong.svc.cluster.local
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy-bridge
  namespace: default
spec:
  type: ExternalName
  externalName: kong-kong-proxy.kong.svc.cluster.local
  ports:
    - port: 80
      targetPort: 80
