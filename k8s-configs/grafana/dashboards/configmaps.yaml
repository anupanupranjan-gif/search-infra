      "tags": [
        "searchx",
        "logs"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_LOKI",
            "type": "datasource",
            "query": "loki",
            "hide": 0,
            "current": {}
          }
