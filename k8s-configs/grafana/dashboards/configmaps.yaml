apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-log-explorer
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  log-explorer.json: |
    {
      "title": "Log Explorer",
      "uid": "log-explorer",
      "tags": ["searchx", "logs"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "app",
            "type": "query",
            "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
            "query": "label_values(app)",
            "refresh": 2,
            "includeAll": true,
            "multi": false,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 2 },
          "options": {
            "mode": "html",
            "content": "<div style=\"display:flex;align-items:center;height:100%;font-size:14px;\">📊 Open the <a href=\"/ops\" target=\"_blank\" style=\"color:#7cd3fd;margin-left:6px;\">Observability Console</a> for live metric cards, throughput sparkline, and Prometheus-context AI chat.</div>"
          }
        },
        {
          "id": 2,
          "type": "logs",
          "title": "Live logs${app:text}",
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "gridPos": { "x": 0, "y": 2, "w": 24, "h": 20 },
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "expr": "{namespace=\"default\", app=~\"$app\"}",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-nexarank-audit-log
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  nexarank-audit-log.json: |
    {
      "title": "NexaRank Audit Log",
      "uid": "nexarank-audit-log",
      "tags": ["searchx", "logs", "audit"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Audit events per minute",
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
          "targets": [
            {
              "expr": "sum(count_over_time({app=\"nexarank-api\"} |= \"AUDIT\" [1m]))",
              "refId": "A",
              "legendFormat": "audit events/min"
            }
          ]
        },
        {
          "id": 2,
          "type": "logs",
          "title": "AUDIT log lines (com.nexarank.api.service.AuditService)",
          "description": "Filters nexarank-api pod logs for the literal 'AUDIT' prefix AuditService.recordAction()/recordTier1Action() emit on every rule/user/tenant mutation.",
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 16 },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "expr": "{app=\"nexarank-api\"} |= \"AUDIT\"",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-error-correlation
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  error-correlation.json: |
    {
      "title": "Error Correlation",
      "uid": "error-correlation",
      "tags": ["searchx", "logs", "errors"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-3h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Error/exception lines per minute, by service",
          "description": "One series per app label — spikes lining up across services here is the correlation signal (e.g. nexarank-api errors preceding search-api errors moments later).",
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 },
          "targets": [
            {
              "expr": "sum by (app) (count_over_time({namespace=\"default\"} |~ \"(?i)error|exception\" [1m]))",
              "refId": "A",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "logs",
          "title": "Matching lines across all services",
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "gridPos": { "x": 0, "y": 10, "w": 24, "h": 14 },
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "expr": "{namespace=\"default\"} |~ \"(?i)error|exception\"",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-zero-results
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  zero-results.json: |
    {
      "title": "Zero Results",
      "uid": "zero-results",
      "tags": ["searchx", "search-quality"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-7d", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Zero-result queries (range)",
          "datasource": { "type": "postgres", "uid": "nexarank-postgres" },
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 6 },
          "targets": [
            {
              "rawSql": "SELECT count(*) AS value FROM zero_result_queries WHERE occurred_at BETWEEN $__timeFrom() AND $__timeTo()",
              "format": "table",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Recovery rate",
          "description": "% of zero-result queries where ZERO_RESULT_RECOVERY (NR-59) found a suggested query that returned real hits. Requires the stage to be enabled — it defaults OFF (V47).",
          "datasource": { "type": "postgres", "uid": "nexarank-postgres" },
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 6 },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [
            {
              "rawSql": "SELECT round(100.0 * sum(case when recovered then 1 else 0 end) / nullif(count(*),0), 1) AS value FROM zero_result_queries WHERE occurred_at BETWEEN $__timeFrom() AND $__timeTo()",
              "format": "table",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Zero-result queries over time",
          "datasource": { "type": "postgres", "uid": "nexarank-postgres" },
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 6 },
          "targets": [
            {
              "rawSql": "SELECT $__timeGroup(occurred_at, '1h') AS time, count(*) AS \"zero_results\" FROM zero_result_queries WHERE $__timeFilter(occurred_at) GROUP BY 1 ORDER BY 1",
              "format": "time_series",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "table",
          "title": "Top zero-result queries",
          "datasource": { "type": "postgres", "uid": "nexarank-postgres" },
          "gridPos": { "x": 0, "y": 6, "w": 24, "h": 12 },
          "targets": [
            {
              "rawSql": "SELECT query, count(*) AS occurrences, sum(case when recovered then 1 else 0 end) AS recovered_count FROM zero_result_queries WHERE $__timeFilter(occurred_at) GROUP BY query ORDER BY occurrences DESC LIMIT 20",
              "format": "table",
              "refId": "A"
            }
          ]
        }
      ]
    }
