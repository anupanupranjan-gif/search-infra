# Captured from the live "redis" Helm release (bitnami/redis) which had been
# installed imperatively with no committed values file anywhere in this repo
# -- the same undocumented-imperative-install pattern flagged elsewhere in
# this repo's history. Reconstructed here from `helm get values redis -n
# default` so future upgrades are declarative instead of guesswork.
architecture: standalone
auth:
  enabled: false
tls:
  enabled: true
  authClients: false
  autoGenerated: true

# Added to expose Redis metrics to Prometheus (redis_exporter sidecar,
# bundled by this chart) -- previously not enabled at all, so no Redis
# metrics existed anywhere in this cluster.
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
